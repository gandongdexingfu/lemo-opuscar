<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#F5F5F2}
svg{display:block}
:root{--lw:1;--blue:#2F5BFF}
.f{fill:#F5F5F2}
.sh{opacity:var(--q,1)}
.sh[data-s="0"]{fill:#D6D6D2}.sh[data-s="1"]{fill:#E0E0DC}.sh[data-s="2"]{fill:#E9E9E5}.sh[data-s="3"]{fill:#F0F0ED}
.tp{fill:color-mix(in srgb,#E8EDFF calc(var(--lit,0)*100%),#FCFCFB);opacity:var(--q,1)}
.halo{fill:#7d7d74;opacity:calc(var(--q,1)*.24);filter:blur(9px);transform:translateY(9px)}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--p,1))}
.w1{stroke:color-mix(in srgb,var(--blue) calc(var(--lit,0)*100%),#26262A);stroke-width:calc(var(--lw)*1.9px)}
.w2{stroke:color-mix(in srgb,var(--blue) calc(var(--lit,0)*85%),#3A3A40);stroke-width:calc(var(--lw)*1.25px)}
.w3{stroke:#8A8A8F;stroke-width:calc(var(--lw)*1.0px)}
.w4{stroke:#B2B2B6;stroke-width:calc(var(--lw)*.8px)}
.hid{fill:none;stroke:#8A8A8F;stroke-width:calc(var(--lw)*1.0px);stroke-dasharray:6 5;opacity:var(--q,1)}
.dt circle{fill:#3A3A40;opacity:calc(var(--q,1)*.7)}
.et{fill:#55555A;font-family:'IBM Plex Mono';font-weight:500;opacity:var(--q,1)}
.cap{font-family:'Noto Sans SC';font-weight:500;fill:#1A1A1E}
.cap2{font-family:'IBM Plex Mono','Noto Sans SC';font-weight:400;fill:#55555A}
.big{font-family:'IBM Plex Mono';font-weight:500;fill:var(--blue)}
.lab-name{font-family:'Noto Sans SC';font-weight:500;fill:#1A1A1E}
.lab-sub{font-family:'IBM Plex Mono','Noto Sans SC';font-weight:400;fill:#5A5A60}
.lab-num{font-family:'IBM Plex Mono';font-weight:500;fill:var(--blue)}
.dimt{font-family:'IBM Plex Mono';font-weight:400;fill:#3A3A40}
.lead{fill:none;stroke:#9A9AA0;stroke-width:calc(var(--lw)*1.1px);stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--p,0))}
.grid line{stroke:var(--blue);stroke-width:1.1px;vector-effect:non-scaling-stroke}
.hudt{font-family:'IBM Plex Mono';font-weight:500;fill:var(--blue)}
.tbb{fill:#F2F2EF;opacity:var(--q,1)}.tbs{fill:#FCFCFB;opacity:var(--q,1)}.tbd{fill:#D6D6D2;opacity:var(--q,1)}
.wire-r .tbb{fill:#C9605A}.wire-r .tbs{fill:#DE8C86}.wire-r .tbd{fill:#A84841}
.wire-k .tbb{fill:#4A4A50}.wire-k .tbs{fill:#6E6E74}.wire-k .tbd{fill:#36363B}
</style></head>
<body>
<svg id="v" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs">
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40"><circle cx="20" cy="20" r="1.3" fill="#D7D7D2"/></pattern>
  </defs>
  <rect width="1920" height="1080" fill="#F5F5F2"/>
  <g id="world">
    <rect x="-6000" y="-4000" width="12000" height="8000" fill="url(#grid)"/>
    <g id="ink"></g>
  </g>
  <g id="hud"></g>
</svg>
<script type="module">
const J = await (await fetch('parts.json')).json();
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = (x) => 1 - Math.pow(1 - clamp(x), 3);
const ein = (x) => Math.pow(clamp(x), 2.2);
const lin = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const ink = $('ink'), hud = $('hud'), defs = $('defs'), world = $('world');
const plateB = el('rect', { x: 0, y: 900, width: 1920, height: 180, fill: '#F5F5F2', opacity: 0 }, hud);
const plateT = el('rect', { x: 96, y: 48, width: 640, height: 176, rx: 10, fill: '#F5F5F2', opacity: 0 }, hud);
const rise = J.rise;
const K = J.scale * Math.sqrt(1.6), A = J.az * Math.PI / 180, E = Math.PI / 6;
const iso = (x, y, z) => [(x * Math.sin(A) - y * Math.cos(A)) * K, ((x * Math.cos(A) + y * Math.sin(A)) * Math.sin(E) - z * Math.cos(E)) * K];
const topM = (z) => { const o = iso(0, 0, z); return `matrix(${(Math.sin(A) * K).toFixed(4)} ${(Math.cos(A) * Math.sin(E) * K).toFixed(4)} ${(-Math.cos(A) * K).toFixed(4)} ${(Math.sin(A) * Math.sin(E) * K).toFixed(4)} ${o[0].toFixed(2)} ${o[1].toFixed(2)})`; };

// ---- 零件與文字（同 v2） ----
const parts = [];
function part(parent, svg, t0, dur) { const g = el('g', {}, parent); g.innerHTML = svg; const o = { g, t0, dur }; parts.push(o); return o; }
function reveal(t) { for (const p of parts) { const a = lin(t, p.t0, p.t0 + p.dur), q = lin(t, p.t0 + p.dur * .4, p.t0 + p.dur * 1.2); const key = a.toFixed(3) + '|' + q.toFixed(3); if (p.k !== key) { p.g.style.setProperty('--p', a.toFixed(4)); p.g.style.setProperty('--q', q.toFixed(4)); p.k = key; } } }
let clipN = 0; const texts = [];
function writeText(parent, { x, y, s, size, cls, t0, cps = 16, anchor = 'start', id, out = 1e9 }) {
  const cid = 'c' + (clipN++); const cp = el('clipPath', { id: cid }, defs);
  const w = [...s].reduce((a, ch) => a + (ch.charCodeAt(0) > 0x2e80 ? 1.02 : .62), 0) * size + size;
  const r = el('rect', { x: anchor === 'start' ? x - size * .2 : anchor === 'middle' ? x - w / 2 : x - w, y: y - size * 1.15, width: 0, height: size * 1.6 }, cp);
  const tx = el('text', { x, y, class: cls, 'font-size': size, 'clip-path': `url(#${cid})`, 'text-anchor': anchor }, parent);
  tx.textContent = s;
  const o = { r, w, t0, dur: Math.max(.35, [...s].length / cps), tx, s, id: id || cid, out }; texts.push(o); return o;
}
function revealText(t) { for (const o of texts) { o.r.setAttribute('width', (o.w * eout(lin(t, o.t0, o.t0 + o.dur))).toFixed(1)); o.tx.setAttribute('opacity', (1 - lin(t, o.out, o.out + .4)).toFixed(3)); } }
function centreLine(a, b, dash = [26, 6, 4, 6]) { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); let s = 0, i = 0, d = ''; while (s < L) { const len = dash[i % 4]; if (i % 2 === 0) { const e = Math.min(L, s + len); d += `M${(a[0] + dx * s / L).toFixed(1)} ${(a[1] + dy * s / L).toFixed(1)}L${(a[0] + dx * e / L).toFixed(1)} ${(a[1] + dy * e / L).toFixed(1)}`; } s += len; i++; } return d; }

// =========================================================================
// 時間表
const T = { keysGo: 6.4, morph0: 7.1, morph1: 8.5, dive0: 13.8, dive1: 15.4, grid: 15.0, touch1: 17.0, touch2: 20.4, pinch0: 22.2, pinch1: 24.0, back0: 25.2, back1: 27.0, dims: 27.2, out1: 33.2, f2: 33.8, sim: 35.2, ex: 36.8 };
// HUD 字卡位置（螢幕座標）
const HX = 1180, HY = 330;
// ---- 1. 2007 年的鍵盤手機 ----
const S0 = el('g', {}, ink);
part(S0, `<path class="ln w4" pathLength="1" d="${centreLine(iso(30.5, -14, 15.5), iso(30.5, 125, 15.5)) + centreLine(iso(-12, 53.5, 15.5), iso(72, 53.5, 15.5))}"/>`, .1, .9);
const MG = el('g', {}, S0);
const morphG = J.morph.map((svg, i) => { const g = el('g', {}, MG); g.innerHTML = svg; g.style.display = i ? 'none' : ''; return g; });
parts.push({ g: MG, t0: .8, dur: 1.2 });
const keys = J.bb.keys.map((kk) => { const o = part(S0, kk.svg, 1.4 + kk.row * .12 + kk.col * .03, .6); o.row = kk.row; o.col = kk.col; return o; });
const nav = J.bb.nav.map((svg, i) => { const o = part(S0, svg, 1.25 + i * .05, .6); o.row = -1; o.col = i; return o; });
const outA = 8.2;
writeText(hud, { x: HX, y: HY, s: '2007 年的智能手机', size: 46, cls: 'cap', t0: 1.3, id: 'a1', out: outA });
writeText(hud, { x: HX, y: HY + 60, s: 'BlackBerry Curve 8300 · 实体全键盘', size: 28, cls: 'cap2', t0: 2.2, cps: 24, id: 'a2', out: outA });
writeText(hud, { x: HX, y: HY + 106, s: '屏幕 2.5 英寸，只占正面的 30%', size: 28, cls: 'cap2', t0: 2.9, cps: 20, id: 'a3', out: outA });
const RX = 150, RY = 300;
writeText(hud, { x: RX, y: RY - 96, s: '屏幕占正面', size: 28, cls: 'cap2', t0: 3.6, id: 'r0', out: T.dive0 });
const ratio = el('text', { x: RX, y: RY + 20, class: 'big', 'font-size': 128 }, hud);
function setRatio(t) { const u = ease(lin(t, T.morph0, T.morph1)); ratio.textContent = Math.round((J.ratio.bb + (J.ratio.ip - J.ratio.bb) * u) * 100) + '%'; ratio.setAttribute('opacity', (lin(t, 3.6, 4.2) * (1 - lin(t, T.dive0, T.dive0 + .5))).toFixed(3)); }

// ---- 2. FIG.01 初代 iPhone 正面 ----
const F1 = el('g', {}, ink);
const f1order = { shell: [0, .01], body: [0, .01], glass: [8.4, 1.0], bezel: [8.5, .9], bottom: [9.0, .7], sleep: [9.1, .5] };
J.fig1.items.forEach((it) => { const [t0, d] = f1order[it.id]; part(F1, it.svg, t0, d); });
writeText(hud, { x: HX, y: HY, s: '初代 iPhone · 2007', size: 46, cls: 'cap', t0: 8.7, cps: 14, id: 'b1', out: 13.8 });
writeText(hud, { x: HX, y: HY + 60, s: '键盘消失，正面全是屏幕', size: 30, cls: 'cap2', t0: 9.1, cps: 16, id: 'b2', out: 13.8 });

// ---- 3. 震撼段落：觸控電極網格（玻璃平面座標，mm） ----
const ZG = 11.36, WX = (61 - 49.3) / 2, WY = 20.5, AW = 49.3, AH = 74.0, COLS = 10, ROWS = 15;
const G3 = el('g', { transform: topM(ZG), class: 'grid' }, F1);
const gridLines = [];
for (let c = 0; c <= COLS; c++) gridLines.push({ e: el('line', { x1: WX + AW * c / COLS, y1: WY, x2: WX + AW * c / COLS, y2: WY + AH }, G3), t0: T.grid + c * .05, kind: 'c', i: c });
for (let r = 0; r <= ROWS; r++) gridLines.push({ e: el('line', { x1: WX, y1: WY + AH * r / ROWS, x2: WX + AW, y2: WY + AH * r / ROWS }, G3), t0: T.grid + .5 + r * .04, kind: 'r', i: r });
const scan = el('rect', { x: WX, y: WY, width: AW, height: AH / ROWS, fill: '#2F5BFF', opacity: 0 }, G3);   // 逐行掃描的驅動線
const touches = [0, 1].map(() => {
  const g = el('g', {}, G3);
  const rings = [0, 1, 2].map(() => el('circle', { fill: 'none', stroke: '#2F5BFF', 'stroke-width': 1.4, 'vector-effect': 'non-scaling-stroke' }, g));
  const pad = el('circle', { r: 4.2, fill: '#2F5BFF', 'fill-opacity': .16, stroke: '#2F5BFF', 'stroke-width': 1.6, 'vector-effect': 'non-scaling-stroke' }, g);
  const hx = el('line', { stroke: '#2F5BFF', 'stroke-width': 2.4, 'vector-effect': 'non-scaling-stroke' }, g);
  const hy = el('line', { stroke: '#2F5BFF', 'stroke-width': 2.4, 'vector-effect': 'non-scaling-stroke' }, g);
  const dot = el('circle', { r: 1.0, fill: '#2F5BFF' }, g);
  return { g, rings, pad, hx, hy, dot };
});
const P1a = [24, 52], P2a = [37, 66], P1b = [17, 38], P2b = [45, 80];
writeText(hud, { x: 960, y: 952, s: '玻璃背后，是一张透明的电极网格', size: 32, cls: 'cap', t0: 15.4, cps: 12, anchor: 'middle', id: 's1', out: 27.4 });
writeText(hud, { x: 960, y: 1000, s: '手指一碰，交叉点的电容改变，位置就被算出来', size: 32, cls: 'cap', t0: 18.6, cps: 14, anchor: 'middle', id: 's2', out: 27.4 });
writeText(hud, { x: 960, y: 1046, s: '两根手指同时识别：张开两指，就能放大', size: 28, cls: 'cap2', t0: 20.8, cps: 14, anchor: 'middle', id: 's3', out: 27.4 });
const hudTouch = el('text', { x: 150, y: 150, class: 'hudt', 'font-size': 30 }, hud);
const hudXY = el('text', { x: 150, y: 196, class: 'cap2', 'font-size': 24 }, hud);
writeText(hud, { x: 150, y: 104, s: '多点触控', size: 40, cls: 'cap', t0: 16.2, cps: 8, id: 'mt', out: 27.4 });
function touchFrame(t) {
  const on = lin(t, T.grid, T.grid + 1.2) * (1 - lin(t, T.back0 + .8, T.back1));
  for (const L of gridLines) L.e.setAttribute('opacity', (lin(t, L.t0, L.t0 + .3) * .32 * (1 - lin(t, T.back0 + .8, T.back1))).toFixed(3));
  const sc = (t - (T.grid + 1.6)) / .9; const row = ((Math.floor(sc * ROWS) % ROWS) + ROWS) % ROWS;
  scan.setAttribute('y', (WY + AH * row / ROWS).toFixed(2)); scan.setAttribute('opacity', (t > T.grid + 1.6 ? .07 * on : 0).toFixed(3));
  const pin = ease(lin(t, T.pinch0, T.pinch1));
  const pos = [[P1a[0] + (P1b[0] - P1a[0]) * pin, P1a[1] + (P1b[1] - P1a[1]) * pin], [P2a[0] + (P2b[0] - P2a[0]) * pin, P2a[1] + (P2b[1] - P2a[1]) * pin]];
  const starts = [T.touch1, T.touch2];
  let n = 0;
  touches.forEach((tc, j) => {
    const a = lin(t, starts[j], starts[j] + .25) * (1 - lin(t, T.back0 + .6, T.back0 + 1.2)); if (a > .5) n++;
    tc.g.setAttribute('opacity', a.toFixed(3));
    const [x, y] = pos[j];
    // 對齊到最近的電極交叉點（真實的定位會在交叉點之間插值；這裡標出被觸發的那一行一列）
    const ci = Math.round((x - WX) / AW * COLS), ri = Math.round((y - WY) / AH * ROWS);
    const cx = WX + AW * ci / COLS, cy = WY + AH * ri / ROWS;
    tc.pad.setAttribute('cx', x); tc.pad.setAttribute('cy', y);
    tc.hx.setAttribute('x1', WX); tc.hx.setAttribute('x2', WX + AW); tc.hx.setAttribute('y1', cy); tc.hx.setAttribute('y2', cy);
    tc.hy.setAttribute('y1', WY); tc.hy.setAttribute('y2', WY + AH); tc.hy.setAttribute('x1', cx); tc.hy.setAttribute('x2', cx);
    tc.hx.setAttribute('opacity', .55); tc.hy.setAttribute('opacity', .55);
    tc.dot.setAttribute('cx', cx); tc.dot.setAttribute('cy', cy);
    tc.rings.forEach((rg, k) => { const u = ((t - starts[j] - k * .33) % 1.0 + 1.0) % 1.0; const live = t > starts[j] + k * .33; rg.setAttribute('cx', x); rg.setAttribute('cy', y); rg.setAttribute('r', (4.2 + u * 11).toFixed(2)); rg.setAttribute('opacity', live ? ((1 - u) * .7).toFixed(3) : 0); });
  });
  hudTouch.textContent = n ? `检测到 ${n} 个触点` : '';
  hudXY.textContent = n ? pos.slice(0, n).map((p) => `(${p[0].toFixed(1)}, ${(p[1] - WY).toFixed(1)}) mm`).join('   ') : '';
  const hv = (1 - lin(t, T.back0 + .6, T.back0 + 1.2)).toFixed(3); hudTouch.setAttribute('opacity', hv); hudXY.setAttribute('opacity', hv);
}
// 尺寸線
const D = J.fig1.dims;
function dim(dd, t0, label) {
  part(F1, `<path class="ln w4" pathLength="1" d="${dd.ext}"/><path class="ln w3" pathLength="1" d="${dd.line}"/><path class="ln w3" pathLength="1" d="${dd.heads}"/>`, t0, .7);
  let ang = dd.angle; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
  const g = el('g', { transform: `translate(${dd.mid[0].toFixed(1)} ${dd.mid[1].toFixed(1)}) rotate(${ang.toFixed(2)})` }, F1);
  writeText(g, { x: 0, y: -10, s: label, size: 22, cls: 'dimt', t0: t0 + .45, anchor: 'middle', cps: 14, id: 'dim' + label, out: T.out1 });
}
dim(D.d115, T.dims, '115 mm'); dim(D.d61, T.dims + .4, '61 mm'); dim(D.d116, T.dims + .8, '11.6 mm');
writeText(hud, { x: HX, y: HY, s: '115 × 61 × 11.6 mm · 135 g', size: 34, cls: 'cap2', t0: T.dims + .3, cps: 20, id: 'b3', out: T.out1 });
writeText(hud, { x: HX, y: HY + 56, s: '屏幕 3.5 英寸 · 480×320 · 163 ppi', size: 28, cls: 'cap2', t0: T.dims + .8, cps: 26, id: 'b4', out: T.out1 });

// =========================================================================
// 4. FIG.02 背面：九組（階梯式爆炸）
const F2 = el('g', {}, ink);
// 精確版：每個零件一個 <g>，順序由 Anatomy audit 算出的 key＋爆炸位移決定（每幀重排，同 Raptor）
const IT2 = J.fig2.items.map((it) => { const g = el('g', {}, F2); part(g, it.svg, T.f2 + (8 - it.g) * .04, 1.3); return { ...it, el: g, k: it.keys.A }; });
let ORDER2 = '';
const G2 = J.fig2.groups.map((g) => ({ ...g, items: IT2.filter((it) => it.g === g.index) }));
// 三段爆炸（時間表與 audit 同一份 J.tl）：A 抬升成塔 → B 各組在各自高度上滑到階梯位置 → C 組內分層升起
const TL = J.tl;
const shA = (t) => ease(lin(t, T.ex + TL.lift[0], T.ex + TL.lift[1]));
const shB = (i, t) => ease(lin(t, T.ex + TL.slide0 + Math.abs(i - 4) * TL.stagger, T.ex + TL.slide0 + Math.abs(i - 4) * TL.stagger + TL.slideDur));
const shC = (t) => ease(lin(t, T.ex + TL.subs[0], T.ex + TL.subs[1]));
const shareOf = (i, t) => shB(i, t);
writeText(hud, { x: HX, y: HY, s: '背面爆炸图', size: 46, cls: 'cap', t0: T.f2, cps: 10, id: 'c1', out: T.ex + 3.0 });
writeText(hud, { x: HX, y: HY + 60, s: '9 个组件，从正面到背面编号', size: 28, cls: 'cap2', t0: T.f2 + .8, cps: 14, id: 'c2', out: T.ex + 3.0 });
// SIM 卡托標註（世界座標，跟著卡托）
const SIMS = IT2.filter((it) => it.tag === 'sim'), SIMGI = SIMS[0].g;
const simLab = el('g', {}, ink);
writeText(simLab, { x: 0, y: 0, s: 'SIM 卡托 · 回形针一顶就弹出', size: 24, cls: 'cap2', t0: T.sim + .6, cps: 14, id: 'sim', out: T.ex + .2 });

// ---- 巡覽 ----
const TOUR0 = T.ex + 4.6, MOVE = .8;
const HOLD = (i) => (i === 5 ? 5.4 : 2.7);
const stops = []; { let t = TOUR0; for (let i = 0; i < 9; i++) { stops.push({ i, t, hold: HOLD(i) }); t += HOLD(i) + MOVE; } }
const TOUR1 = stops[8].t + stops[8].hold;
const B = J.fig2.box; const BC = [(B[0] + B[2]) / 2, (B[1] + B[3]) / 2];
const ZTOP = J.fig2.groups.map((g) => g.ztop);
const EXTRA = J.fig2.groups.map((g) => (g.extra >= 3 ? g.extra - 1 : g.extra));   // 組內最高分層（螺絲層不算）
const labels = J.fig2.groups.map((g, i) => {
  const above = i % 2 === 0, st = stops[i], t0 = st.t - .15;
  const grp = el('g', {}, ink);
  const leader = el('path', { class: 'lead', pathLength: 1 }, grp);
  const dot = el('circle', { r: 5, fill: '#2F5BFF' }, grp);
  const num = String(i + 1).padStart(2, '0');
  const tg = el('g', {}, grp);
  const n = g.sub.length;
  const nameY = above ? -(n * 32 + 14) : 46, subY0 = above ? -n * 32 + 18 : 88;
  writeText(tg, { x: 0, y: nameY, s: num, size: 28, cls: 'lab-num', t0: t0 + .3, cps: 20, id: 'n' + num });
  writeText(tg, { x: 54, y: nameY, s: g.name, size: 36, cls: 'lab-name', t0: t0 + .4, cps: 14, id: 'l' + num });
  g.sub.forEach((s, j) => writeText(tg, { x: 54, y: subY0 + j * 32, s, size: 24, cls: 'lab-sub', t0: t0 + .9 + j * .3, cps: 26, id: 'l' + num + 's' + j }));
  return { g, i, above, st, t0, grp, leader, dot, tg };
});
