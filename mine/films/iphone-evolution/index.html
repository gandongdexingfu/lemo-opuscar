<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F5F5F2}
svg{display:block}
:root{--lw:1;--blue:#2F5BFF}
/* 淺色極簡（Anatomy light 主題的配色，加粗到短影音看得清） */
.f{fill:#F5F5F2}
.sh{opacity:var(--q,1)}
.sh[data-s="0"]{fill:#D6D6D2}.sh[data-s="1"]{fill:#E0E0DC}.sh[data-s="2"]{fill:#E9E9E5}.sh[data-s="3"]{fill:#F0F0ED}
.tp{fill:color-mix(in srgb,#E8EDFF calc(var(--lit,0)*100%),#FCFCFB);opacity:var(--q,1)}
.halo{fill:#7d7d74;opacity:calc(var(--q,1)*.26);filter:blur(9px);transform:translateY(9px)}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--p,1))}
.w1{stroke:color-mix(in srgb,var(--blue) calc(var(--lit,0)*100%),#26262A);stroke-width:calc(var(--lw)*2.1px)}
.w2{stroke:color-mix(in srgb,var(--blue) calc(var(--lit,0)*85%),#3A3A40);stroke-width:calc(var(--lw)*1.4px)}
.w3{stroke:#8A8A8F;stroke-width:calc(var(--lw)*1.1px)}
.w4{stroke:#B2B2B6;stroke-width:calc(var(--lw)*.9px)}
.hid{fill:none;stroke:#8A8A8F;stroke-width:calc(var(--lw)*1.0px);stroke-dasharray:6 5;opacity:var(--q,1)}
.dt circle{fill:#3A3A40;opacity:calc(var(--q,1)*.7)}
.et{fill:#55555A;font-family:'IBM Plex Mono';opacity:var(--q,1)}
.cap{font-family:'Noto Sans SC';font-weight:500;fill:#1A1A1E}
.cap2{font-family:'IBM Plex Mono','Noto Sans SC';font-weight:400;fill:#55555A}
.big{font-family:'IBM Plex Mono';font-weight:500;fill:var(--blue)}
.lab-name{font-family:'Noto Sans SC';font-weight:500;fill:#1A1A1E}
.lab-sub{font-family:'IBM Plex Mono','Noto Sans SC';font-weight:400;fill:#5A5A60}
.lab-num{font-family:'IBM Plex Mono';font-weight:500;fill:var(--blue)}
.dimt{font-family:'IBM Plex Mono';font-weight:400;fill:#3A3A40}
.lead{fill:none;stroke:#9A9AA0;stroke-width:calc(var(--lw)*1.1px);stroke-dasharray:1 1;stroke-dashoffset:calc(1 - var(--p,0))}
</style></head>
<body>
<svg id="v" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs">
    <pattern id="grid" patternUnits="userSpaceOnUse" width="40" height="40"><circle cx="20" cy="20" r="1.3" fill="#D7D7D2"/></pattern>
  </defs>
  <rect width="1080" height="1920" fill="#F5F5F2"/>
  <g id="world">
    <rect x="-3000" y="-3000" width="8000" height="12000" fill="url(#grid)"/>
    <g id="ink"></g>
  </g>
</svg>
<script type="module">
const J = await (await fetch('parts.json')).json();
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = (x) => 1 - Math.pow(1 - clamp(x), 3);
const ein = (x) => Math.pow(clamp(x), 2.2);
const lin = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const ink = $('ink'), defs = $('defs'), world = $('world');

// ---- 零件：一個 <g>，--p 線條畫出、--q 明暗淡入 ----
const parts = [];
function part(parent, svg, t0, dur) { const g = el('g', {}, parent); g.innerHTML = svg; const o = { g, t0, dur }; parts.push(o); return o; }
function reveal(t) {
  for (const p of parts) {
    const a = lin(t, p.t0, p.t0 + p.dur), q = lin(t, p.t0 + p.dur * .4, p.t0 + p.dur * 1.2);
    const key = a.toFixed(3) + '|' + q.toFixed(3);
    if (p.k !== key) { p.g.style.setProperty('--p', a.toFixed(4)); p.g.style.setProperty('--q', q.toFixed(4)); p.k = key; }
  }
}
// ---- 文字：由左到右寫出；hide 時間後淡出 ----
let clipN = 0; const texts = [];
function writeText(parent, { x, y, s, size, cls, t0, cps = 16, anchor = 'start', id, out = 1e9 }) {
  const cid = 'c' + (clipN++);
  const cp = el('clipPath', { id: cid }, defs);
  const w = [...s].reduce((a, ch) => a + (ch.charCodeAt(0) > 0x2e80 ? 1.02 : .62), 0) * size + size;
  const r = el('rect', { x: anchor === 'start' ? x - size * .2 : anchor === 'middle' ? x - w / 2 : x - w, y: y - size * 1.15, width: 0, height: size * 1.6 }, cp);
  const tx = el('text', { x, y, class: cls, 'font-size': size, 'clip-path': `url(#${cid})`, 'text-anchor': anchor }, parent);
  tx.textContent = s;
  const o = { r, w, t0, dur: Math.max(.35, [...s].length / cps), tx, s, id: id || cid, out };
  texts.push(o); return o;
}
function revealText(t) { for (const o of texts) { o.r.setAttribute('width', (o.w * eout(lin(t, o.t0, o.t0 + o.dur))).toFixed(1)); o.tx.setAttribute('opacity', (1 - lin(t, o.out, o.out + .4)).toFixed(3)); } }
function centreLine(a, b, dash = [26, 6, 4, 6]) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); let s = 0, i = 0, d = '';
  while (s < L) { const len = dash[i % 4]; if (i % 2 === 0) { const e = Math.min(L, s + len); d += `M${(a[0] + dx * s / L).toFixed(1)} ${(a[1] + dy * s / L).toFixed(1)}L${(a[0] + dx * e / L).toFixed(1)} ${(a[1] + dy * e / L).toFixed(1)}`; } s += len; i++; }
  return d;
}
const iso = (() => { const a = J.az * Math.PI / 180, e = Math.PI / 6, k = J.scale * Math.sqrt(1.6);
  return (x, y, z) => [880 + (x * Math.sin(a) - y * Math.cos(a)) * k, 3380 + ((x * Math.cos(a) + y * Math.sin(a)) * Math.sin(e) - z * Math.cos(e)) * k]; })();
const rise = J.rise;

// =========================================================================
// 招牌時刻（0–9 s）：鍵盤手機 → iPhone
const T = { keysGo: 6.4, morph0: 7.1, morph1: 8.5, f1: 8.4, dims: 10.6, out1: 15.4, f2: 16.1, ex: 17.8 };
const S0 = el('g', {}, ink);
part(S0, `<path class="ln w4" pathLength="1" d="${centreLine(iso(30.5, -14, 15.5), iso(30.5, 125, 15.5)) + centreLine(iso(-12, 53.5, 15.5), iso(72, 53.5, 15.5))}"/>`, .1, .9);
const MG = el('g', {}, S0);
const morphG = J.morph.map((svg, i) => { const g = el('g', {}, MG); g.innerHTML = svg; g.style.display = i ? 'none' : ''; return g; });
parts.push({ g: MG, t0: .8, dur: 1.2 });
const keys = J.bb.keys.map((kk, i) => { const o = part(S0, kk.svg, 1.4 + kk.row * .12 + kk.col * .03, .6); o.row = kk.row; o.col = kk.col; return o; });
const nav = J.bb.nav.map((svg, i) => part(S0, svg, 1.25 + i * .05, .6));
const capX = 560, capY = 3858;
const outA = 8.2;
writeText(ink, { x: capX, y: capY, s: '2007 年的智能手机', size: 34, cls: 'cap', t0: 1.3, id: 'a1', out: outA });
writeText(ink, { x: capX, y: capY + 44, s: 'BlackBerry Curve 8300 · 实体全键盘', size: 22, cls: 'cap2', t0: 2.2, cps: 24, id: 'a2', out: outA });
writeText(ink, { x: capX, y: capY + 80, s: '屏幕 2.5 英寸，只占正面的 30%', size: 22, cls: 'cap2', t0: 2.9, cps: 20, id: 'a3', out: outA });
// 屏幕占比計數器（左上，訊號藍）
const RX = 470, RY = 3205;
writeText(ink, { x: RX, y: RY - 70, s: '屏幕占正面', size: 22, cls: 'cap2', t0: 3.6, id: 'r0', out: 15.4 });
const ratio = el('text', { x: RX, y: RY + 10, class: 'big', 'font-size': 92 }, ink);
function setRatio(t) {
  const u = ease(lin(t, T.morph0, T.morph1));
  const v = J.ratio.bb + (J.ratio.ip - J.ratio.bb) * u;
  ratio.textContent = Math.round(v * 100) + '%';
  ratio.setAttribute('opacity', lin(t, 3.6, 4.2).toFixed(3) * (1 - lin(t, T.out1, T.out1 + .5)));
}

// FIG. 01：iPhone 正面（變形結束後接手）
const F1 = el('g', {}, ink);
const f1order = { shell: [0, .01], body: [0, .01], glass: [T.f1, 1.0], bezel: [T.f1 + .1, .9], bottom: [T.f1 + .6, .7], sleep: [T.f1 + .7, .5] };
J.fig1.items.forEach((it) => { const [t0, d] = f1order[it.id]; part(F1, it.svg, t0, d); });
writeText(ink, { x: capX, y: capY, s: '2007 · 初代 iPhone', size: 34, cls: 'cap', t0: 8.6, cps: 14, id: 'b1', out: T.out1 });
writeText(ink, { x: capX, y: capY + 44, s: '键盘消失了，整个正面变成屏幕', size: 22, cls: 'cap2', t0: 9.3, cps: 14, id: 'b2', out: T.out1 });
writeText(ink, { x: capX, y: capY + 80, s: '屏幕 3.5 英寸，占正面 52%', size: 22, cls: 'cap2', t0: 10.2, cps: 14, id: 'b3', out: T.out1 });
// 尺寸線（官方數據）
const D = J.fig1.dims;
function dim(dd, t0, label) {
  part(F1, `<path class="ln w4" pathLength="1" d="${dd.ext}"/><path class="ln w3" pathLength="1" d="${dd.line}"/><path class="ln w3" pathLength="1" d="${dd.heads}"/>`, t0, .7);
  let ang = dd.angle; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
  const g = el('g', { transform: `translate(${dd.mid[0].toFixed(1)} ${dd.mid[1].toFixed(1)}) rotate(${ang.toFixed(2)})` }, F1);
  writeText(g, { x: 0, y: -10, s: label, size: 22, cls: 'dimt', t0: t0 + .45, anchor: 'middle', cps: 14, id: 'dim' + label, out: T.out1 });
}
dim(D.d115, T.dims, '115 mm'); dim(D.d61, T.dims + .4, '61 mm'); dim(D.d116, T.dims + .8, '11.6 mm');

// =========================================================================
// FIG. 02：背面爆炸圖
const F2 = el('g', {}, ink);
const G2 = J.fig2.groups.map((g, i) => { const wrap = el('g', {}, F2); part(wrap, g.svg, T.f2 + (8 - i) * .04, 1.3); return { ...g, wrap }; });
const shareOf = (i, t) => ease(lin(t, T.ex + (8 - i) * .24, T.ex + (8 - i) * .24 + 1.7));
writeText(ink, { x: capX, y: capY, s: '背面爆炸图', size: 34, cls: 'cap', t0: T.f2, cps: 10, id: 'c1' });
writeText(ink, { x: capX, y: capY + 44, s: '9 个组件，按拆机顺序编号', size: 22, cls: 'cap2', t0: T.f2 + .7, cps: 12, id: 'c2' });

// ---- 鏡頭巡覽：逐組停留（天線蓋 01 → 邊框 09） ----
const TOUR0 = 22.4, MOVE = .75;
const HOLD = (i) => (i === 5 ? 3.3 : 2.2);       // 主板（g6）停久一點
const stops = []; { let t = TOUR0; for (let k = 0; k < 9; k++) { const i = 8 - k; stops.push({ i, t, hold: HOLD(i) }); t += HOLD(i) + MOVE; } }
const TOUR1 = stops[8].t + stops[8].hold;
const groupCY = (i) => (J.fig2.box[1] + J.fig2.box[3]) / 2 - J.fig2.groups[i].lift - 60;
const LX = 1205;
const labels = J.fig2.groups.map((g, i) => {
  const st = stops.find((s) => s.i === i), t0 = st.t - .15;
  const grp = el('g', {}, ink);
  const leader = el('path', { class: 'lead', pathLength: 1 }, grp);
  const dot = el('circle', { r: 4.6, fill: '#2F5BFF' }, grp);
  const num = String(9 - i).padStart(2, '0');
  const tg = el('g', {}, grp);
  writeText(tg, { x: 0, y: 0, s: num, size: 26, cls: 'lab-num', t0: t0 + .3, cps: 20, id: 'n' + num });
  writeText(tg, { x: 50, y: 0, s: g.name, size: 32, cls: 'lab-name', t0: t0 + .4, cps: 14, id: 'l' + num });
  g.sub.forEach((s, j) => writeText(tg, { x: 50, y: 40 + j * 31, s, size: 21, cls: 'lab-sub', t0: t0 + .9 + j * .3, cps: 26, id: 'l' + num + 's' + j }));
  return { g, i, t0, st, grp, leader, dot, tg };
});
function placeLabels(t) {
  for (const L of labels) {
    const lift = L.g.lift * shareOf(L.i, t);
    const ax = L.g.anchor[0], ay = L.g.anchor[1] - lift, yl = ay - 56;
    const a = lin(t, L.t0, L.t0 + .5);
    L.leader.setAttribute('d', `M${ax.toFixed(1)} ${ay.toFixed(1)}L${(ax + 36).toFixed(1)} ${yl.toFixed(1)}L${LX - 14} ${yl.toFixed(1)}`);
    L.leader.style.setProperty('--p', ease(a).toFixed(4));
    L.dot.setAttribute('cx', ax.toFixed(1)); L.dot.setAttribute('cy', ay.toFixed(1)); L.dot.setAttribute('opacity', clamp(a * 4).toFixed(3));
    L.tg.setAttribute('transform', `translate(${LX} ${(yl + 10).toFixed(1)})`);
    // 強調色：停留期間這一組亮成訊號藍
    const lit = lin(t, L.st.t - .2, L.st.t + .3) * (1 - lin(t, L.st.t + L.st.hold + .2, L.st.t + L.st.hold + .7));
    G2[L.i].wrap.style.setProperty('--lit', lit.toFixed(3));
  }
}

// ---- 標題欄（結尾大遠景） ----
const TB = el('g', {}, ink);
const tbx = 1250, tby = 3790, TBt = TOUR1 + 1.3;
part(TB, `<path class="ln w2" pathLength="1" d="M${tbx} ${tby}H${tbx + 560}V${tby + 250}H${tbx}Z M${tbx} ${tby + 64}H${tbx + 560} M${tbx} ${tby + 128}H${tbx + 560} M${tbx} ${tby + 190}H${tbx + 560} M${tbx + 300} ${tby + 128}V${tby + 190}"/>`, TBt, 1.0);
writeText(TB, { x: tbx + 20, y: tby + 44, s: '初代 iPhone · 2007', size: 32, cls: 'cap', t0: TBt + .4, id: 'tb1' });
writeText(TB, { x: tbx + 20, y: tby + 107, s: '115 × 61 × 11.6 mm · 135 g', size: 22, cls: 'cap2', t0: TBt + .8, cps: 24, id: 'tb2' });
writeText(TB, { x: tbx + 20, y: tby + 170, s: '9 个组件', size: 22, cls: 'cap2', t0: TBt + 1.1, id: 'tb3' });
writeText(TB, { x: tbx + 320, y: tby + 170, s: '图 01', size: 22, cls: 'cap2', t0: TBt + 1.3, id: 'tb4' });
writeText(TB, { x: tbx + 20, y: tby + 230, s: '数据：Apple 官方规格 · iFixit 拆机', size: 19, cls: 'cap2', t0: TBt + 1.2, cps: 20, id: 'tb5' });

// =========================================================================
// 鏡頭
const CAM = [[0.0, 870, 3540, 1.14], [6.0, 880, 3555, 1.24], [T.out1, 880, 3555, 1.24], [T.ex, 880, 3540, 1.2], [T.ex + 3.6, 1060, 2300, .5]];
stops.forEach((s) => { CAM.push([s.t, 1118, groupCY(s.i), .92]); CAM.push([s.t + s.hold, 1118, groupCY(s.i) + (s.i === 5 ? 18 : 12), .92]); });
CAM.push([TOUR1 + 2.6, 1080, 2260, .47], [TOUR1 + 8.2, 1080, 2250, .46]);
const DUR = +(TOUR1 + 8.2).toFixed(2);
function camAt(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++;
  const [t0, x0, y0, z0] = CAM[i], [t1, x1, y1, z1] = CAM[i + 1];
  const u = ease(lin(t, t0, t1));
  return [x0 + (x1 - x0) * u, y0 + (y1 - y0) * u, Math.exp(Math.log(z0) + (Math.log(z1) - Math.log(z0)) * u)];
}

window.DUR = DUR;
window.render = (t) => {
  const [cx, cy, z] = camAt(t);
  world.setAttribute('transform', `translate(540 960) scale(${z.toFixed(5)}) translate(${(-cx).toFixed(2)} ${(-cy).toFixed(2)})`);
  document.documentElement.style.setProperty('--lw', (Math.pow(z, .65) / z).toFixed(4));
  // 鍵帽飛走：一排一排往上、淡出
  for (const kk of keys.concat(nav.map((n, j) => ({ ...n, row: -1, col: j })))) {
    const s = T.keysGo + (kk.row + 1) * .13 + kk.col * .025, u = ein(lin(t, s, s + .75));
    kk.g.setAttribute('transform', `translate(0 ${(-u * 70 * rise).toFixed(2)})`);
    kk.g.setAttribute('opacity', (1 - lin(t, s + .2, s + .75)).toFixed(3));
  }
  // 機身與屏幕變形
  const u = ease(lin(t, T.morph0, T.morph1)), idx = Math.round(u * 24);
  morphG.forEach((g, i) => (g.style.display = i === idx ? '' : 'none'));
  MG.setAttribute('opacity', (1 - lin(t, T.morph1, T.morph1 + .3)).toFixed(3));
  S0.style.display = t > T.morph1 + .35 ? 'none' : '';
  F1.style.display = t < T.morph1 - .05 || t > T.out1 + .9 ? 'none' : '';
  F1.setAttribute('opacity', (1 - lin(t, T.out1, T.out1 + .8)).toFixed(3));
  F2.style.display = t < T.f2 - .05 ? 'none' : '';
  for (const g of G2) g.wrap.setAttribute('transform', `translate(0 ${(-g.lift * shareOf(g.index, t)).toFixed(2)})`);
  setRatio(t); reveal(t); revealText(t); placeLabels(t);
};
window.TEXTS = (t) => texts.filter((o) => t >= o.t0 + o.dur && t < o.out && o.tx.closest('g')?.style.display !== 'none').map((o) => { const b = o.tx.getBoundingClientRect(); return { id: o.id, text: o.s, x0: b.left, y0: b.top, x1: b.right, y1: b.bottom }; }).filter((b) => b.x1 > 0 && b.y1 > 0 && b.x0 < 1080 && b.y0 < 1920);
await document.fonts.ready;
window.render(0);
window.READY = true;
</script>
</body></html>
